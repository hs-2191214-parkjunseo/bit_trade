<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코인 자동매매 봇 대시보드 (업비트 모의투자)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap');
    body { font-family: 'Pretendard', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">
  <!-- 상단 헤더 -->
  <header class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></div>
        <h1 class="text-lg md:text-xl font-bold tracking-tight text-white flex items-center gap-2">
          <span>UPBIT TRADING BOT</span>
          <span class="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2 py-0.5 rounded-full font-mono">가상매매 가동중</span>
        </h1>
      </div>
      <div class="text-right">
        <div class="text-xs text-slate-400">비트코인(BTC/KRW) 현재가</div>
        <div id="current-price" class="text-base md:text-lg font-mono font-bold text-emerald-400">조회중...</div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">
    <!-- 모니터링 요약 카드 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
        <div class="text-xs text-slate-400 mb-1">총 운용 가상원금</div>
        <div class="text-lg md:text-xl font-bold font-mono text-white">3,000,000원</div>
        <div class="text-xs text-slate-500 mt-1">전략당 각 100만 원</div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
        <div class="text-xs text-slate-400 mb-1">합산 평가금액</div>
        <div id="total-portfolio-val" class="text-lg md:text-xl font-bold font-mono text-white">계산중...</div>
        <div id="total-profit-rate" class="text-xs font-mono font-semibold mt-1 text-slate-400">-</div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
        <div class="text-xs text-slate-400 mb-1">체결된 거래 건수</div>
        <div id="total-trade-count" class="text-lg md:text-xl font-bold font-mono text-cyan-400">0회</div>
        <div class="text-xs text-slate-500 mt-1">업비트 수수료 0.05% 반영</div>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4">
        <div class="text-xs text-slate-400 mb-1">최근 데이터 갱신</div>
        <div id="last-updated" class="text-sm md:text-base font-mono text-slate-300">대기중</div>
        <div class="text-xs text-slate-500 mt-1">5초 주기 자동 갱신</div>
      </div>
    </div>

    <!-- 3가지 전략 카드 그리드 -->
    <div>
      <h2 class="text-base md:text-lg font-bold text-white mb-3 flex items-center gap-2">
        <span>전략별 실시간 수익률 및 시그널 대조</span>
      </h2>
      <div id="strategies-container" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- 렌더링 영역 -->
      </div>
    </div>

    <!-- 최근 체결 기록 테이블 -->
    <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 md:p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-base font-bold text-white flex items-center gap-2">
          <span>최근 가상 체결 로그</span>
          <span id="log-count" class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded">0건</span>
        </h3>
        <button onclick="fetchStatus()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 text-slate-300 transition">
          즉시 새로고침
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs md:text-sm">
          <thead>
            <tr class="text-slate-400 border-b border-slate-800 font-medium">
              <th class="pb-2">시간</th>
              <th class="pb-2">전략</th>
              <th class="pb-2">구분</th>
              <th class="pb-2 text-right">체결단가</th>
              <th class="pb-2 text-right">수량 / 총액</th>
              <th class="pb-2 text-right">손익률</th>
              <th class="pb-2 pl-3">사유</th>
            </tr>
          </thead>
          <tbody id="trades-body" class="divide-y divide-slate-800/60 font-mono">
            <tr>
              <td colspan="7" class="py-6 text-center text-slate-500">체결 대기 중...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        renderDashboard(data);
      } catch (err) {
        console.error('데이터 갱신 실패:', err);
      }
    }

    function renderDashboard(data) {
      // 1. 현재가 및 시간
      document.getElementById('current-price').innerText = `${Number(data.currentPrice).toLocaleString()} 원`;
      const timeStr = new Date(data.updatedAt).toLocaleTimeString('ko-KR');
      document.getElementById('last-updated').innerText = timeStr;

      // 2. 총합 계산
      let totalPortfolio = 0;
      let totalInitial = 0;
      let totalTrades = 0;
      const allTrades = [];

      data.strategies.forEach(s => {
        totalPortfolio += s.summary.portfolioValue;
        totalInitial += s.summary.initialKrw;
        totalTrades += s.summary.totalTrades;
        if (s.summary.trades) {
          allTrades.push(...s.summary.trades);
        }
      });

      const totalProfitRate = ((totalPortfolio - totalInitial) / totalInitial) * 100;
      const totalProfitEl = document.getElementById('total-profit-rate');
      document.getElementById('total-portfolio-val').innerText = `${Math.round(totalPortfolio).toLocaleString()}원`;
      totalProfitEl.innerText = `${totalProfitRate >= 0 ? '+' : ''}${totalProfitRate.toFixed(2)}% (${Math.round(totalPortfolio - totalInitial).toLocaleString()}원)`;
      totalProfitEl.className = `text-xs font-mono font-semibold mt-1 ${totalProfitRate >= 0 ? 'text-rose-400' : 'text-blue-400'}`;

      document.getElementById('total-trade-count').innerText = `${totalTrades}회`;

      // 3. 전략 카드 렌더링
      const container = document.getElementById('strategies-container');
      container.innerHTML = data.strategies.map((s, idx) => {
        const isProfit = s.summary.totalProfitRate >= 0;
        const profitColor = isProfit ? 'text-rose-400' : 'text-blue-400';
        const hasCoin = s.summary.coinBalance > 0.000001;

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 flex flex-col justify-between hover:border-slate-700 transition">
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-mono text-slate-500">전략 0${idx + 1}</span>
                <span class="text-xs px-2 py-0.5 rounded-full font-semibold ${hasCoin ? 'bg-amber-950 text-amber-400 border border-amber-800' : 'bg-slate-800 text-slate-400'}">
                  ${hasCoin ? '코인 보유중' : 'KRW 보유대기'}
                </span>
              </div>
              <h3 class="font-bold text-white text-base">${s.name}</h3>
              <p class="text-xs text-slate-400 mt-1 line-clamp-2">${s.description}</p>

              <div class="mt-4 pt-3 border-t border-slate-800/80 space-y-2 font-mono text-xs">
                <div class="flex justify-between">
                  <span class="text-slate-400">평가금액:</span>
                  <span class="font-bold text-white">${Math.round(s.summary.portfolioValue).toLocaleString()}원</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">수익률 (손익):</span>
                  <span class="font-bold ${profitColor}">
                    ${isProfit ? '+' : ''}${s.summary.totalProfitRate.toFixed(2)}% (${Math.round(s.summary.totalProfitKrw).toLocaleString()}원)
                  </span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">보유 수량:</span>
                  <span class="text-slate-200">${s.summary.coinBalance.toFixed(6)} BTC</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">매수 평단가:</span>
                  <span class="text-slate-200">${s.summary.avgBuyPrice > 0 ? Math.round(s.summary.avgBuyPrice).toLocaleString() + '원' : '-'}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">최대낙폭(MDD):</span>
                  <span class="text-slate-400">${s.summary.maxDrawdown.toFixed(2)}%</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">청산 승률:</span>
                  <span class="text-cyan-400">${s.summary.winRate.toFixed(1)}% (${s.summary.sellTrades}회 청산)</span>
                </div>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-800/80 bg-slate-950/50 p-2.5 rounded-lg">
              <div class="text-[11px] text-slate-400 font-medium">현재 시그널 상태</div>
              <div class="text-xs text-amber-300 font-mono mt-0.5 truncate">${s.lastSignalReason}</div>
            </div>
          </div>
        `;
      }).join('');

      // 4. 최근 체결 내역
      allTrades.sort((a, b) => b.timestamp - a.timestamp);
      document.getElementById('log-count').innerText = `${allTrades.length}건`;

      const tbody = document.getElementById('trades-body');
      if (allTrades.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-slate-500">아직 체결된 내역이 없습니다.</td></tr>';
      } else {
        tbody.innerHTML = allTrades.slice(0, 15).map(t => {
          const isBuy = t.side === 'bid';
          const sideBadge = isBuy 
            ? '<span class="text-rose-400 font-bold bg-rose-950/70 border border-rose-800 px-1.5 py-0.5 rounded text-[11px]">매수</span>'
            : '<span class="text-blue-400 font-bold bg-blue-950/70 border border-blue-800 px-1.5 py-0.5 rounded text-[11px]">매도</span>';
          const pnlText = t.profitRate !== undefined 
            ? `<span class="${t.profitRate >= 0 ? 'text-rose-400' : 'text-blue-400'}">${t.profitRate >= 0 ? '+' : ''}${t.profitRate.toFixed(2)}%</span>` 
            : '<span class="text-slate-600">-</span>';

          return `
            <tr class="hover:bg-slate-800/40">
              <td class="py-2.5 text-slate-400 text-[11px]">${new Date(t.timestamp).toLocaleTimeString('ko-KR')}</td>
              <td class="py-2.5 text-slate-300 font-medium">${t.strategyName}</td>
              <td class="py-2.5">${sideBadge}</td>
              <td class="py-2.5 text-right text-slate-200">${Math.round(t.price).toLocaleString()}원</td>
              <td class="py-2.5 text-right text-slate-300">${t.volume.toFixed(6)} BTC</td>
              <td class="py-2.5 text-right">${pnlText}</td>
              <td class="py-2.5 pl-3 text-slate-400 text-xs font-sans truncate max-w-[200px]">${t.reason || '-'}</td>
            </tr>
          `;
        }).join('');
      }
    }

    // 5초 주기 폴링
    fetchStatus();
    setInterval(fetchStatus, 5000);
  </script>
</body>
</html>
